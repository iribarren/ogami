# CI runs the same Makefile targets and compose services as local development
# (ADR 0008), so a green `make qa test e2e` locally means a green CI run.
# The Makefile exports UID/GID from the runner user, so files written through
# the bind mounts (vendor/, node_modules/, reports) stay owned by the runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Skip compose.override.yaml (host ports, Xdebug host mapping): CI needs none of it.
  # compose.ci.yaml builds the images with the GitHub Actions layer cache.
  DOCKER_COMPOSE: docker compose -f compose.yaml -f compose.ci.yaml

jobs:
  backend:
    name: Backend (QA + PHPUnit + Behat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      # A BuildKit builder that can read and write the GitHub Actions cache
      # (compose.ci.yaml), and the runtime token that cache needs. Pinned to
      # commit SHAs because the runtime action handles that token.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Build the php image
        run: make build SERVICES=php

      # Only the image build needs the cache token: clear it, so the installs and
      # tests that run next cannot write cache entries.
      - name: Drop the cache token
        run: echo "ACTIONS_RUNTIME_TOKEN=" >> "$GITHUB_ENV"

      - name: Start php + database
        run: make up SERVICES=php

      - name: QA (PHPStan + PHPat, PHP-CS-Fixer, Rector)
        run: make backend-qa

      - name: Tests (PHPUnit unit + integration on PostgreSQL, Behat)
        run: make backend-test

      - name: Service logs
        if: failure()
        run: docker compose -f compose.yaml logs --no-color

  frontend:
    name: Frontend (QA + Vitest + builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          # Holds the pnpm store too (it lives inside node_modules in the container).
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Build and start node
        run: make build up SERVICES=node

      - name: QA (ESLint, Prettier, TypeScript)
        run: make frontend-qa

      - name: Tests (Vitest)
        run: make frontend-test

      - name: Build the SPA and Storybook
        run: make frontend-build storybook-build

      - name: Service logs
        if: failure()
        run: docker compose -f compose.yaml logs --no-color

  e2e:
    name: Full stack (API contract + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # A BuildKit builder that can read and write the GitHub Actions cache
      # (compose.ci.yaml), and the runtime token that cache needs. Pinned to
      # commit SHAs because the runtime action handles that token.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Build the images
        run: make build

      # Only the image build needs the cache token: clear it, so the installs and
      # tests that run next cannot write cache entries.
      - name: Drop the cache token
        run: echo "ACTIONS_RUNTIME_TOKEN=" >> "$GITHUB_ENV"

      - name: Start every service
        run: make up

      - name: OpenAPI spec and TypeScript types are up to date
        run: make api-check

      # `make e2e` seeds the e2e users (migrations + idempotent app:user:create) first.
      - name: Seed e2e users and run Playwright
        run: make e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Service logs
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
