framework:
    rate_limiter:
        # Self-service password reset requests (Identity PublicAccountController). The limiters
        # are consumed per normalized email and per client IP; over either, the endpoint still
        # answers 202 and sends nothing, so the answer never reveals anything.
        password_reset_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        password_reset_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
