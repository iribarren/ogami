security:
    # The domain User stays framework-free; Symfony Security sees it through
    # SecurityUser. The Application PasswordHasher port hashes with this same
    # configuration, so a created user's hash verifies at login (ADR 0006).
    password_hashers:
        App\Identity\Infrastructure\Security\SecurityUser: 'auto'

    providers:
        identity:
            id: App\Identity\Infrastructure\Security\IdentityUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: identity
            # JSON in, JSON out: never an HTML login form or redirect.
            entry_point: App\Identity\Infrastructure\Security\JsonAuthenticationEntryPoint
            access_denied_handler: App\Identity\Infrastructure\Security\JsonAccessDeniedHandler
            json_login:
                # Route names: the routes accept POST only.
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Identity\Infrastructure\Security\JsonAuthenticationSuccessHandler
                failure_handler: App\Identity\Infrastructure\Security\JsonAuthenticationFailureHandler
            # Counts failed logins per email + IP, and 5x that per IP.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: api_auth_logout

    # Secure by default: every API path needs a session unless listed here.
    # Roles are independent (ADR 0006): there is no role_hierarchy.
    # Non-API paths are the SPA, served by Vite/Caddy, and stay unguarded.
    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc\.json$, roles: PUBLIC_ACCESS }
        - { path: ^/api(/|$), roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
