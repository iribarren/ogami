# Ogami development environment (ADR 0008).
# Every variable has a safe default; override any of them in a git-ignored
# root .env file:
#   UID, GID            host user mapping (the Makefile sets them from `id -u`/`id -g`)
#   HTTP_PORT           API/app port on the host (default 8080)
#   POSTGRES_PORT       database port on the host (default 5433, compose.override.yaml)
#   MAILPIT_PORT        Mailpit web UI on the host (default 8026, compose.override.yaml)
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD   dev credentials (default ogami)
#   XDEBUG_MODE         off (default) | debug | coverage | develop
name: ogami

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      SERVER_NAME: ":80"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ogami}:${POSTGRES_PASSWORD:-ogami}@database:5432/${POSTGRES_DB:-ogami}?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./backend:/app
      - ./docker/php/frontend.d:/etc/frankenphp/frontend.d:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Caddy's admin endpoint answers as soon as the server is up.
      test: ["CMD", "curl", "-fsS", "http://localhost:2019/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ogami}
      POSTGRES_USER: ${POSTGRES_USER:-ogami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ogami}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Idles until the frontend exists (T4). Then mount ./frontend:/app and run Vite:
    #   command: ["pnpm", "dev", "--host", "0.0.0.0"]
    command: ["sleep", "infinity"]
    init: true

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
  caddy_data:
  caddy_config:
